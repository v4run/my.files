# --- Prefix key ---------------------------------------------
# Use Ctrl-g instead of Ctrl-b
unbind C-b
set -g prefix C-g
bind C-g send-prefix

# --- General settings ---------------------------------------
set -g default-terminal "tmux-256color"       # italics + undercurl inside tmux
# Reset first so reloading this file (prefix r) doesn't keep appending duplicates
set -su terminal-overrides
set -su terminal-features
set -as terminal-overrides ",*256col*:Tc"     # true colors
# Colored undercurls (Neovim diagnostics) via tmux's native feature flag.
# (Hand-written Smulx/Setulc strings in double quotes lose the \E and print
# literal "E[58:2:..." into panes.)
set -as terminal-features ",*:usstyle"
set -g history-limit 10000                    # bigger scrollback
set -g mouse on                               # mouse scroll/select/resize
set -sg escape-time 10                        # snappier ESC in vim
set -g focus-events on
set -g base-index 1                           # windows start at 1
setw -g pane-base-index 1                     # panes start at 1
set -g renumber-windows on                    # renumber after closing

# --- Reload config ------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Calendar popup (replaces built-in clock-mode) ----------
# Full-screen popup running tcal with combined highlighting and clock.
bind t display-popup -E -B -w 100% -h 100% "tcal -highlight=combined -with-clock"

# --- Splits -------------------------------------------------
# e = split horizontally (side-by-side), o = split vertically (stacked)
bind e split-window -h -c "#{pane_current_path}"
bind o split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in current directory
bind c new-window -c "#{pane_current_path}"

# Rename the current session (pre-fills the existing name)
bind R command-prompt -I "#S" "rename-session -- '%%'"

# Create a new session (prompts for a name)
bind S command-prompt -p "new session:" "new-session -s '%%'"

# --- Pane navigation (vim-style: prefix + h/j/k/l) ----------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (prefix + H/J/K/L, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move the current pane in a direction (prefix + C-h/j/k/l, repeatable).
# Swaps with the neighbouring pane; focus follows the moved pane.
bind -r C-h swap-pane -s '{left-of}'
bind -r C-j swap-pane -s '{down-of}'
bind -r C-k swap-pane -s '{up-of}'
bind -r C-l swap-pane -s '{right-of}'

# Fuzzy switchers via fzf with vim-like modes (see ~/.tmux/switcher.sh):
# j/k move, / search, c clear filter, x delete, r rename, enter switch, q quit.
# prefix + w: all sessions and windows across sessions, current session first.
# prefix + s: sessions only (replaces built-in choose-tree).
bind w display-popup -E -b rounded -w 90% -h 70% "~/.tmux/switcher.sh all"
bind s display-popup -E -b rounded -w 70% -h 50% "~/.tmux/switcher.sh sessions"

# Quick window switching
bind -r n next-window
bind -r p previous-window
bind Tab last-window                          # toggle last active window
bind BTab switch-client -l                    # toggle last session (shift-tab)

# Move window left/right in the window list (repeatable)
bind -r P swap-window -t -1 \; previous-window
bind -r N swap-window -t +1 \; next-window

# Pull a pane from another window into the current one
# Prompts for source: e.g. "2.1" = window 2, pane 1
bind @ command-prompt -p "join pane from:" "join-pane -s '%%'"

# Mark/unmark a pane (prefix + m), then pull the marked pane into current window (prefix + C-m)
bind m select-pane -m
bind C-m join-pane

# Pick a pane layout from a menu
bind Space display-menu -T "Select layout" \
  "even-horizontal"  h "select-layout even-horizontal" \
  "even-vertical"    v "select-layout even-vertical" \
  "main-horizontal"  m "select-layout main-horizontal" \
  "main-vertical"    n "select-layout main-vertical" \
  "tiled"            t "select-layout tiled"

# Toggle synchronize-panes (type once, send to all panes in window)
bind a setw synchronize-panes \; display "Sync panes: #{?pane_synchronized,ON,OFF}"

# --- Copy mode (vim keys) -----------------------------------
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar (minimal, text-only) ------------------------
# Toggle the status bar on/off
bind g if -F '#{==:#{status},off}' 'set -g status 2' 'set -g status off'

set -g status-position bottom
set -g status-interval 5
set -g status 2
set -gu status-format
# Separator line with the session name embedded; the trailing rule
# overshoots and tmux clips it at the client width.
set -g status-format[0] "#[fg=black] #[fg=blue,bold]#S#[fg=black,nobold] #{R:─,#{client_width}}"
set -g status-format[1] "#[align=left]#{T:status-left}#[list=on]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange],#[range=window|#{window_index}]#{T:window-status-current-format}#[norange]}#[nolist align=right]#{T:status-right}"
set -g status-justify left
set -g status-style "bg=default,fg=white"

# Left: empty; the session name lives on the separator line above
set -g status-left ""
set -g status-left-length 40

# Right: prefix indicator only, when active (date/time live in prefix t)
set -g status-right "#[fg=magenta,bold]#{?client_prefix, PREFIX ,}#[default]"
set -g status-right-length 80

# Windows: active gets a subtle faint pill, inactive is dim text.
# Colors are ANSI names so they follow the active lull-* Ghostty theme
# (green = sage, black = the lifted "color 0", brightblack = muted fg).
# Suffix: lens icon when zoomed, else pane count only when split.
# Inactive names are truncated to 12 chars; the active one shows in full.
setw -g window-status-current-format "#[fg=green,bg=black,bold] #W#{?window_zoomed_flag, \uf00e,#{?#{>:#{window_panes},1}, (#{window_panes}),}} #[default]"
setw -g window-status-format "#[fg=brightblack] #{=/12/\u2026:window_name}#{?window_zoomed_flag, \uf00e,#{?#{>:#{window_panes},1}, (#{window_panes}),}} #[default]"
setw -g window-status-separator ""

# --- Pane borders -------------------------------------------
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

# --- Message / command-prompt styling -----------------------
set -g message-style "bg=default,fg=blue,bold"
# Copy-mode selection: slate block with dark text, mirrors lualine's Normal
# mode block and stays readable on black/dark/light.
set -g mode-style "bg=blue,fg=black"

